# ==========================================
# Server Configuration (HTTPS Setup)
# ==========================================
server.port=8444
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=bioverify123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bioverify

# ==========================================
# Database Configuration (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/bioverify?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configurations
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# Schema Initialization
# ==========================================
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

# ==========================================
# File Upload Settings (for potential photo sync)
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==========================================
# BioVerify Biometric SDK & Simulation Settings
# ==========================================
# Set to 'false' to enforce physical Mantra scanner verification. 
# If 'true' or if SDK native library is missing, system falls back to simulated scanner.
bioverify.biometrics.simulator-mode=false
bioverify.biometrics.license.server=/local
bioverify.biometrics.license.port=5000
bioverify.biometrics.license.components=Biometrics.FingerExtraction,Biometrics.FingerMatching

# AES Encryption Key for biometric templates stored in the database
# Must be a 32-character hexadecimal key (256-bit AES)
bioverify.security.aes-key=4a706e4e372e6b72646d51677a33567a
